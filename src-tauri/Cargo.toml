[package]
name = "chikku-parser"
version = "0.3.49"
description = "Desktop app for viewing, combining, and transforming CSV data"
authors = ["Abin Jacob <aj4abinjacob@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chikku_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
open = "5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

duckdb = { version = "1.1", features = ["bundled"] }
calamine = { version = "0.26", features = ["dates"] }
rust_xlsxwriter = "0.79"

parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
ureq = { version = "2", features = ["tls"] }
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
scraper = "0.20"
url = "2"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
