name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag commit is on master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/master"; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit contained in master." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches app metadata
        run: npm run release:check -- ${{ github.ref_name }} --skip-clean --skip-remote --allow-existing-tag

  build:
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-2022
            rust_target: ""
            args: ""
          - platform: ubuntu-22.04
            rust_target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Configure macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          append_env() {
            local name="$1"
            local value="$2"

            if [ -n "$value" ]; then
              {
                echo "${name}<<__${name}__"
                echo "$value"
                echo "__${name}__"
              } >> "$GITHUB_ENV"
            fi
          }

          append_env "APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_SECRET"
          append_env "APPLE_CERTIFICATE_PASSWORD" "$APPLE_CERTIFICATE_PASSWORD_SECRET"
          append_env "APPLE_SIGNING_IDENTITY" "$APPLE_SIGNING_IDENTITY_SECRET"
          append_env "APPLE_ID" "$APPLE_ID_SECRET"
          append_env "APPLE_PASSWORD" "$APPLE_PASSWORD_SECRET"
          append_env "APPLE_TEAM_ID" "$APPLE_TEAM_ID_SECRET"

      - name: Configure Windows C++ flags
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CXXFLAGS=/std:c++17 /EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Chikku Parser ${{ github.ref_name }}
          generateReleaseNotes: true
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-updater-notes:
    name: Publish updater notes
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Copy GitHub release notes into updater feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/chikku-updater
          gh release download "$TAG_NAME" --repo "$REPO" --pattern latest.json --dir /tmp/chikku-updater

          release_body="$(gh release view "$TAG_NAME" --repo "$REPO" --json body --jq '.body')"
          if [ -z "$release_body" ] || [ "$release_body" = "null" ]; then
            echo "GitHub release body is empty; refusing to publish blank updater notes." >&2
            exit 1
          fi

          tag_version="${TAG_NAME#v}"
          manifest_version="$(jq -r '.version' /tmp/chikku-updater/latest.json)"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Updater manifest version $manifest_version does not match tag $tag_version." >&2
            exit 1
          fi

          jq --arg notes "$release_body" '.notes = $notes' \
            /tmp/chikku-updater/latest.json > /tmp/chikku-updater/latest.with-notes.json
          mv /tmp/chikku-updater/latest.with-notes.json /tmp/chikku-updater/latest.json

          gh release upload "$TAG_NAME" /tmp/chikku-updater/latest.json --repo "$REPO" --clobber
